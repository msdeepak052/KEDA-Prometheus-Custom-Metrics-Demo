# Dummy application source code, injected via ConfigMap so we never need to
# build/push a container image. It uses ONLY the Python standard library.
#
# Endpoints:
#   GET /work    -> increments the http_requests_total counter, returns 200
#   GET /metrics -> serves the counter in Prometheus text exposition format
#   GET /healthz -> liveness/readiness probe target
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-code
  namespace: demo
data:
  app.py: |
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    request_count = 0
    lock = threading.Lock()

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            global request_count
            if self.path == "/metrics":
                with lock:
                    count = request_count
                body = (
                    "# HELP http_requests_total Total number of HTTP requests handled by /work\n"
                    "# TYPE http_requests_total counter\n"
                    'http_requests_total{method="GET",path="/work"} %d\n' % count
                ).encode()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            elif self.path == "/work":
                with lock:
                    request_count += 1
                body = b"work done\n"
                self.send_response(200)
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            elif self.path == "/healthz":
                self.send_response(200)
                self.send_header("Content-Length", "0")
                self.end_headers()
            else:
                self.send_response(404)
                self.end_headers()

        def log_message(self, format, *args):
            pass

    if __name__ == "__main__":
        server = ThreadingHTTPServer(("0.0.0.0", 8080), Handler)
        server.serve_forever()
