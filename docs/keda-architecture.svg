<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1680" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="1680" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="42" font-size="24" font-weight="700" fill="#0f172a">KEDA + Prometheus — Chronological Architecture Flow</text>
  <text x="40" y="64" font-size="13" fill="#64748b">Applies to this demo's manifests/30-scaledobject.yaml — steps run top to bottom, then loop from ⑩ back to ⑤</text>

  <!-- Legend -->
  <g font-size="12" fill="#334155">
    <rect x="40" y="82" width="14" height="14" rx="3" fill="#2563EB"/>
    <text x="60" y="93">Kubernetes core (unmodified)</text>

    <rect x="250" y="82" width="14" height="14" rx="3" fill="#7C3AED"/>
    <text x="270" y="93">keda-operator</text>

    <rect x="410" y="82" width="14" height="14" rx="3" fill="#0D9488"/>
    <text x="430" y="93">keda-admission-webhooks</text>

    <rect x="640" y="82" width="14" height="14" rx="3" fill="#B45309"/>
    <text x="660" y="93">keda-operator-metrics-apiserver</text>

    <rect x="40" y="106" width="14" height="14" rx="3" fill="#E6522C"/>
    <text x="60" y="117">prometheus-server</text>

    <text x="250" y="117" font-style="italic" fill="#64748b">* Prometheus scaler = in-process module inside keda-operator, not a separate Pod</text>
  </g>

  <!-- connecting spine -->
  <line x1="55" y1="196" x2="55" y2="1384" stroke="#CBD5E1" stroke-width="3"/>

  <!-- ================= STEP TEMPLATE (10 rows) ================= -->
  <!-- Row 0 : y=140 -->
  <g>
    <circle cx="55" cy="196" r="20" fill="#2563EB"/>
    <text x="55" y="201" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="100" y="140" width="860" height="112" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="815" y="152" width="130" height="22" rx="11" fill="#DBEAFE"/>
    <text x="880" y="167" font-size="11" fill="#1D4ED8" text-anchor="middle">kube-apiserver</text>
    <text x="120" y="178" font-size="15" font-weight="700" fill="#0f172a">User applies the ScaledObject</text>
    <text x="120" y="202" font-size="13" fill="#334155">kubectl apply -f 30-scaledobject.yaml — targets demo-app's</text>
    <text x="120" y="222" font-size="13" fill="#334155">Deployment with a Prometheus trigger (query + threshold).</text>
  </g>

  <!-- Row 1 : y=272 -->
  <g>
    <circle cx="55" cy="328" r="20" fill="#0D9488"/>
    <text x="55" y="333" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="100" y="272" width="860" height="112" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="775" y="284" width="170" height="22" rx="11" fill="#CCFBF1"/>
    <text x="860" y="299" font-size="11" fill="#0F766E" text-anchor="middle">keda-admission-webhooks</text>
    <text x="120" y="310" font-size="15" font-weight="700" fill="#0f172a">Admission webhook checks it's valid</text>
    <text x="120" y="334" font-size="13" fill="#334155">Checks scaleTargetRef exists, min isn't bigger than max, and the</text>
    <text x="120" y="354" font-size="13" fill="#334155">trigger config makes sense before Kubernetes saves it.</text>
  </g>

  <!-- Row 2 : y=404 -->
  <g>
    <circle cx="55" cy="460" r="20" fill="#7C3AED"/>
    <text x="55" y="465" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <rect x="100" y="404" width="860" height="112" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="845" y="416" width="100" height="22" rx="11" fill="#EDE9FE"/>
    <text x="895" y="431" font-size="11" fill="#5B21B6" text-anchor="middle">keda-operator</text>
    <text x="120" y="442" font-size="15" font-weight="700" fill="#0f172a">keda-operator picks it up</text>
    <text x="120" y="466" font-size="13" fill="#334155">Works out that demo-app is what needs scaling, and creates a</text>
    <text x="120" y="486" font-size="13" fill="#334155">Prometheus scaler* for this trigger (see the note below).</text>
  </g>

  <!-- Row 3 : y=536 -->
  <g>
    <circle cx="55" cy="592" r="20" fill="#7C3AED"/>
    <text x="55" y="597" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <rect x="100" y="536" width="860" height="112" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="845" y="548" width="100" height="22" rx="11" fill="#EDE9FE"/>
    <text x="895" y="563" font-size="11" fill="#5B21B6" text-anchor="middle">keda-operator</text>
    <text x="120" y="574" font-size="15" font-weight="700" fill="#0f172a">keda-operator creates the HPA</text>
    <text x="120" y="598" font-size="13" fill="#334155">Creates a normal HPA, keda-hpa-demo-app-scaledobject, pointed at</text>
    <text x="120" y="618" font-size="13" fill="#334155">demo-app and wired to an External metric it owns.</text>
  </g>

  <!-- Row 4 : y=668 -->
  <g>
    <circle cx="55" cy="724" r="20" fill="#7C3AED"/>
    <text x="55" y="729" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <rect x="100" y="668" width="860" height="112" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="705" y="680" width="240" height="22" rx="11" fill="#EDE9FE"/>
    <text x="825" y="695" font-size="11" fill="#5B21B6" text-anchor="middle">Prometheus scaler* (in keda-operator) ↻</text>
    <text x="120" y="706" font-size="15" font-weight="700" fill="#0f172a">The Prometheus scaler queries Prometheus</text>
    <text x="120" y="730" font-size="13" fill="#334155">It runs the PromQL query to keep the ScaledObject's status fresh.</text>
    <text x="120" y="750" font-size="13" fill="#334155">(pollingInterval doesn't pace this at minReplicaCount ≥ 1 — KEDA's own</text>
    <text x="120" y="770" font-size="13" fill="#334155" font-style="italic">webhook warns you, see README.) The only step that talks to Prometheus.</text>
  </g>

  <!-- Row 5 : y=800 -->
  <g>
    <circle cx="55" cy="856" r="20" fill="#2563EB"/>
    <text x="55" y="861" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">6</text>
    <rect x="100" y="800" width="860" height="112" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="775" y="812" width="170" height="22" rx="11" fill="#DBEAFE"/>
    <text x="860" y="827" font-size="11" fill="#1D4ED8" text-anchor="middle">kube-controller-manager</text>
    <text x="120" y="838" font-size="15" font-weight="700" fill="#0f172a">The normal HPA controller checks in</text>
    <text x="120" y="862" font-size="13" fill="#334155">On its own ~15s loop, it sees the HPA points at an External</text>
    <text x="120" y="882" font-size="13" fill="#334155">metric, and calls external.metrics.k8s.io to ask for it.</text>
  </g>

  <!-- Row 6 : y=932 -->
  <g>
    <circle cx="55" cy="988" r="20" fill="#B45309"/>
    <text x="55" y="993" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
    <rect x="100" y="932" width="860" height="112" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="745" y="944" width="200" height="22" rx="11" fill="#FEF3C7"/>
    <text x="845" y="959" font-size="11" fill="#92400E" text-anchor="middle">keda-operator-metrics-apiserver</text>
    <text x="120" y="970" font-size="15" font-weight="700" fill="#0f172a">Metrics API server answers the call</text>
    <text x="120" y="994" font-size="13" fill="#334155">It's what actually answers external.metrics.k8s.io requests — it</text>
    <text x="120" y="1014" font-size="13" fill="#334155">just asks keda-operator for the cached value over gRPC (port 9666).</text>
  </g>

  <!-- Row 7 : y=1064 -->
  <g>
    <circle cx="55" cy="1120" r="20" fill="#2563EB"/>
    <text x="55" y="1125" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
    <rect x="100" y="1064" width="860" height="112" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="775" y="1076" width="170" height="22" rx="11" fill="#DBEAFE"/>
    <text x="860" y="1091" font-size="11" fill="#1D4ED8" text-anchor="middle">kube-controller-manager</text>
    <text x="120" y="1102" font-size="15" font-weight="700" fill="#0f172a">The HPA does the maths</text>
    <text x="120" y="1126" font-size="13" fill="#334155">desiredReplicas = ceil(totalValue / threshold), capped between</text>
    <text x="120" y="1146" font-size="13" fill="#334155">minReplicaCount and maxReplicaCount — then it updates demo-app's replicas.</text>
  </g>

  <!-- Row 8 : y=1196 -->
  <g>
    <circle cx="55" cy="1252" r="20" fill="#2563EB"/>
    <text x="55" y="1257" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
    <rect x="100" y="1196" width="860" height="112" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="775" y="1208" width="170" height="22" rx="11" fill="#DBEAFE"/>
    <text x="860" y="1223" font-size="11" fill="#1D4ED8" text-anchor="middle">kube-controller-manager</text>
    <text x="120" y="1234" font-size="15" font-weight="700" fill="#0f172a">Kubernetes creates or removes Pods to match</text>
    <text x="120" y="1258" font-size="13" fill="#334155">Pods get added or removed to hit the new number. Totally normal</text>
    <text x="120" y="1278" font-size="13" fill="#334155">Kubernetes behaviour — nothing KEDA-specific about this step.</text>
  </g>

  <!-- Row 9 : y=1328 -->
  <g>
    <circle cx="55" cy="1384" r="20" fill="#E6522C"/>
    <text x="55" y="1389" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">10</text>
    <rect x="100" y="1328" width="860" height="112" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="835" y="1340" width="110" height="22" rx="11" fill="#FDE4DA"/>
    <text x="890" y="1355" font-size="11" fill="#9A3412" text-anchor="middle">prometheus-server</text>
    <text x="120" y="1366" font-size="15" font-weight="700" fill="#0f172a">The loop closes back through Prometheus</text>
    <text x="120" y="1390" font-size="13" fill="#334155">The new set of Pods changes what Prometheus scrapes, so the next</text>
    <text x="120" y="1410" font-size="13" fill="#334155">PromQL check (back at step ⑤) sees the new spread of load.</text>
  </g>

  <!-- feedback arrow from 10 back to 5 -->
  <path d="M 960 1384 C 990 1384 990 724 960 724" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <!-- Scale-to-zero note -->
  <rect x="100" y="1470" width="860" height="150" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-dasharray="5,4"/>
  <text x="120" y="1498" font-size="14" font-weight="700" fill="#0f172a">Scale-to-zero (not used in this demo — we keep minReplicaCount: 1)</text>
  <text x="120" y="1522" font-size="13" fill="#334155">If the trigger stays quiet for cooldownPeriod, keda-operator scales demo-app</text>
  <text x="120" y="1542" font-size="13" fill="#334155">to 0 itself — skipping the HPA completely, since it can't do anything with</text>
  <text x="120" y="1562" font-size="13" fill="#334155">zero pods (no pods, no metrics). The moment traffic comes back, keda-operator</text>
  <text x="120" y="1582" font-size="13" fill="#334155">bumps it back to 1, then hands control back to the HPA for everything above that.</text>

  <text x="40" y="1650" font-size="11" fill="#94A3B8">KEDA docs: keda.sh/docs/2.20/concepts · keda.sh/docs/2.20/scalers/prometheus</text>
</svg>
